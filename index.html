<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Multi-Check</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="widget" data-tauri-drag-region>
      <header class="header" data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>Git Multi-Check</span>
        <span id="summary" class="summary" data-tauri-drag-region>—</span>
      </header>

      <ul id="repo-list" class="repo-list" aria-label="repository status"></ul>

      <footer class="footer" data-tauri-drag-region>
        <span id="status" class="status">loading…</span>
      </footer>
    </div>

    <div id="context-backdrop" class="context-backdrop hidden">
      <div id="context-menu" class="context-menu hidden">
        <button id="menu-settings" class="menu-item" type="button">설정</button>
        <button id="menu-refresh" class="menu-item" type="button">새로고침</button>
        <button id="menu-quit" class="menu-item danger" type="button">종료</button>
      </div>
    </div>
  </body>
</html>
