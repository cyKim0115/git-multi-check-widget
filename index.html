<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repo Multi-Check</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="widget" data-tauri-drag-region>
      <header class="header" data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>Repo Multi-Check</span>
        <span id="summary" class="summary" data-tauri-drag-region>—</span>
      </header>

      <div id="sections" class="sections">
        <section class="repo-section" id="git-section">
          <div class="section-label" data-tauri-drag-region>
            <span class="section-title" data-tauri-drag-region>Git</span>
            <button id="git-pull-btn" class="quick-pull hidden" type="button"></button>
          </div>
          <div id="repo-scroll-wrap" class="repo-scroll-wrap">
            <div id="repo-scroll" class="repo-scroll">
              <ul id="repo-list" class="repo-list" aria-label="git repository status"></ul>
            </div>
            <div id="repo-fade-top" class="repo-fade repo-fade--top" aria-hidden="true"></div>
            <div id="repo-fade-bottom" class="repo-fade repo-fade--bottom" aria-hidden="true"></div>
          </div>
        </section>

        <section class="repo-section hidden" id="svn-section">
          <div class="section-label" data-tauri-drag-region>
            <span class="section-title" data-tauri-drag-region>SVN</span>
            <button id="svn-pull-btn" class="quick-pull hidden" type="button"></button>
          </div>
          <div id="svn-scroll-wrap" class="repo-scroll-wrap">
            <div id="svn-scroll" class="repo-scroll">
              <ul id="svn-list" class="repo-list" aria-label="svn repository status"></ul>
            </div>
            <div id="svn-fade-top" class="repo-fade repo-fade--top" aria-hidden="true"></div>
            <div id="svn-fade-bottom" class="repo-fade repo-fade--bottom" aria-hidden="true"></div>
          </div>
        </section>

        <p id="sections-empty" class="sections-empty hidden" data-tauri-drag-region>
          Git·SVN 영역이 모두 꺼져 있습니다. 우클릭 → 설정에서 켜세요.
        </p>
      </div>

      <footer class="footer" data-tauri-drag-region>
        <span id="status" class="status">loading…</span>
      </footer>
    </div>

    <div id="context-backdrop" class="context-backdrop hidden">
      <div id="context-menu" class="context-menu hidden">
        <button id="menu-settings" class="menu-item" type="button">설정</button>
        <button id="menu-refresh" class="menu-item" type="button">새로고침</button>
        <button id="menu-quit" class="menu-item danger" type="button">종료</button>
      </div>
      <div id="repo-context-menu" class="context-menu hidden">
        <button id="menu-repo-open" class="menu-item" type="button">열기</button>
        <button id="menu-repo-refresh" class="menu-item" type="button">이 레포만 최신화</button>
        <button id="menu-repo-explorer" class="menu-item" type="button">탐색기에서 열기</button>
      </div>
    </div>
  </body>
</html>
