[package]
name = "git-multi-check-widget"
version = "0.1.0"
description = "Desktop widget for multi-repo git status"
authors = ["cykim"]
edition = "2021"

[lib]
name = "git_multi_check_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
auto-launch = "0.5"
winreg = "0.55"
